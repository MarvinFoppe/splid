<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15151b">
<title>Splid – Cheyenne & Marvin</title>
<style>
  :root{
    --bg:#111116;
    --surface:#1a1a22;
    --surface-2:#22222c;
    --line:#2e2e3a;
    --text:#f2f2f5;
    --muted:#9a9aab;
    --accent:#E8505B;
    --accent-soft:rgba(232,80,91,.14);
    --green:#43c88a;
    --green-soft:rgba(67,200,138,.14);
    --radius:16px;
    --radius-sm:11px;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);
    padding:0 0 120px;
    max-width:560px;margin:0 auto;
    min-height:100vh;
  }
  header{
    padding:26px 20px 14px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 72%,transparent);
  }
  h1{font-size:22px;margin:0;letter-spacing:-.3px;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  /* Balance card */
  .balance{
    margin:8px 20px 4px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;text-align:center;
    position:relative;overflow:hidden;
  }
  .balance .label{color:var(--muted);font-size:13px;font-weight:500}
  .balance .amount{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
  .balance .who{font-size:14px;color:var(--muted)}
  .balance.settled .amount{color:var(--green)}
  .balance.owes .amount{color:var(--accent)}

  .accounts{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    margin:14px 20px 6px;
  }
  .acc{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:11px 8px;text-align:center;
  }
  .acc .n{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px}
  .acc .v{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .acc .v.pos{color:var(--green)}
  .acc .v.neg{color:var(--accent)}

  .section-title{
    font-size:12px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);font-weight:600;margin:26px 20px 10px;
  }

  /* Entries list */
  ul.entries{list-style:none;margin:0;padding:0 20px}
  li.entry{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:9px;
  }
  li.entry .ic{
    width:38px;height:38px;flex:0 0 38px;border-radius:11px;
    background:var(--surface-2);display:grid;place-items:center;font-size:18px;
  }
  li.entry .body{flex:1;min-width:0}
  li.entry .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li.entry .m{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li.entry .amt{font-weight:700;font-size:15px;white-space:nowrap}
  li.entry .del{
    border:none;background:none;color:var(--muted);font-size:20px;
    padding:0 2px;cursor:pointer;line-height:1;
  }
  li.entry .del:active{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:30px 20px;font-size:14px}

  /* FAB */
  .fab{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    z-index:30;max-width:560px;width:calc(100% - 40px);
    background:var(--accent);color:#fff;border:none;
    padding:16px;border-radius:14px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;
    box-shadow:0 10px 30px rgba(232,80,91,.35);
  }
  .fab:active{transform:translateX(-50%) scale(.98)}

  /* Sheet / modal */
  .overlay{
    position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex}
  .sheet{
    background:var(--surface);width:100%;max-width:560px;
    border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
    animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 16px}
  .sheet h2{font-size:18px;margin:0 0 18px}

  label.fl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 7px;
    text-transform:uppercase;letter-spacing:.5px}
  .field{margin-bottom:18px}
  input[type=text],input[type=number],input[type=date]{
    width:100%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:16px;
    padding:13px 14px;border-radius:var(--radius-sm);outline:none;
  }
  input:focus{border-color:var(--accent)}
  .price-wrap{position:relative}
  .price-wrap input{padding-left:34px;font-size:22px;font-weight:700}
  .price-wrap .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:20px;font-weight:700}

  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .seg button{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:14px;font-weight:600;padding:12px 6px;
    border-radius:var(--radius-sm);cursor:pointer;line-height:1.25;
  }
  .seg button small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
  .seg button.active{border-color:var(--accent);background:var(--accent-soft)}
  .seg button.active small{color:var(--text)}

  .save{
    width:100%;background:var(--accent);color:#fff;border:none;
    padding:16px;border-radius:14px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;margin-top:6px;
  }
  .save:disabled{opacity:.4}
  .save:active{transform:scale(.99)}

  .tools{display:flex;gap:16px;justify-content:center;margin:34px 20px 0}
  .tools button{background:none;border:none;color:var(--muted);font-family:inherit;
    font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<header>
  <h1>Split<span>.</span></h1>
  <div class="sub">Cheyenne &amp; Marvin</div>
</header>

<div class="balance settled" id="balanceCard">
  <div class="label">Ausgleich</div>
  <div class="amount" id="balAmount">0,00 €</div>
  <div class="who" id="balWho">Alles ausgeglichen 🎉</div>
</div>

<div class="accounts" id="accounts"></div>

<div class="section-title">Ausgaben</div>
<ul class="entries" id="entries"></ul>

<div class="tools">
  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <button id="resetBtn">Alles löschen</button>
</div>

<button class="fab" id="addBtn">＋ Ausgabe hinzufügen</button>

<!-- Add sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2>Neue Ausgabe</h2>

    <div class="field">
      <label class="fl">Beschreibung</label>
      <input type="text" id="fDesc" placeholder="z. B. Einkauf REWE" autocomplete="off">
    </div>

    <div class="field">
      <label class="fl">Preis</label>
      <div class="price-wrap">
        <span class="cur">€</span>
        <input type="number" id="fPrice" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
      </div>
    </div>

    <div class="field">
      <label class="fl">Bezahlt mit</label>
      <div class="seg" id="segPaid">
        <button data-v="cheyenne">Cheyenne<small>Konto</small></button>
        <button data-v="marvin">Marvin<small>Konto</small></button>
        <button data-v="gemein">Gemeinsam<small>Konto</small></button>
      </div>
    </div>

    <div class="field">
      <label class="fl">Bezahlt für</label>
      <div class="seg" id="segFor">
        <button data-v="cheyenne">Cheyenne</button>
        <button data-v="marvin">Marvin</button>
        <button data-v="gemein">Gemeinschaft</button>
      </div>
    </div>

    <div class="field">
      <label class="fl">Datum</label>
      <input type="date" id="fDate">
    </div>

    <button class="save" id="saveBtn" disabled>Speichern</button>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
const KEY='splid_cheyenne_marvin_v1';
const NAMES={cheyenne:'Cheyenne',marvin:'Marvin',gemein:'Gemeinschaft'};
const ACC={cheyenne:'Cheyenne',marvin:'Marvin',gemein:'Gemeinsam'};
let entries=load();
let paid=null,forWhom=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function eur(n){return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}

// --- accounting -------------------------------------------------------------
// provided[p] = wie viel diese Person eingezahlt hat (Gemeinschaftskonto 50/50)
// consumed[p] = wie viel diese Person verbraucht hat (für Gemeinschaft 50/50)
// net = provided - consumed ; positiv => Person hat Guthaben (kriegt Geld)
function compute(){
  let prov={cheyenne:0,marvin:0}, cons={cheyenne:0,marvin:0};
  let accTotals={cheyenne:0,marvin:0,gemein:0}; // Saldo pro Konto (Ausgaben)
  for(const e of entries){
    const p=e.price;
    // eingezahlt
    if(e.paid==='cheyenne') prov.cheyenne+=p;
    else if(e.paid==='marvin') prov.marvin+=p;
    else { prov.cheyenne+=p/2; prov.marvin+=p/2; }
    accTotals[e.paid]+=p;
    // verbraucht
    if(e.forWhom==='cheyenne') cons.cheyenne+=p;
    else if(e.forWhom==='marvin') cons.marvin+=p;
    else { cons.cheyenne+=p/2; cons.marvin+=p/2; }
  }
  const netC=prov.cheyenne-cons.cheyenne;
  const netM=prov.marvin-cons.marvin;
  return {netC,netM,accTotals};
}

function render(){
  const {netC,netM,accTotals}=compute();
  const card=document.getElementById('balanceCard');
  const amt=document.getElementById('balAmount');
  const who=document.getElementById('balWho');
  // netC>0 => Cheyenne hat mehr eingezahlt als verbraucht => Marvin schuldet ihr
  const diff=Math.abs(netC);
  card.className='balance';
  if(diff<0.005){
    card.classList.add('settled');
    amt.textContent='0,00 €';
    who.textContent='Alles ausgeglichen 🎉';
  } else {
    card.classList.add('owes');
    amt.textContent=eur(diff);
    if(netC>0) who.textContent='Marvin schuldet Cheyenne';
    else who.textContent='Cheyenne schuldet Marvin';
  }

  // Konten-Übersicht (wie viel wurde je Konto ausgegeben)
  const accEl=document.getElementById('accounts');
  accEl.innerHTML=['cheyenne','marvin','gemein'].map(k=>`
    <div class="acc">
      <div class="n">${ACC[k]}</div>
      <div class="v">${eur(accTotals[k])}</div>
    </div>`).join('');

  // Liste
  const list=document.getElementById('entries');
  if(!entries.length){
    list.innerHTML='<div class="empty">Noch keine Ausgaben.<br>Tippe unten auf „＋".</div>';
    return;
  }
  const sorted=[...entries].sort((a,b)=>(b.date||'').localeCompare(a.date||'')|| b.id-a.id);
  list.innerHTML=sorted.map(e=>{
    const icon=e.forWhom==='gemein'?'🤝':(e.forWhom==='cheyenne'?'👩':'🧔');
    const d=e.date?new Date(e.date).toLocaleDateString('de-DE',{day:'2-digit',month:'short'}):'';
    return `<li class="entry">
      <div class="ic">${icon}</div>
      <div class="body">
        <div class="t">${escapeHtml(e.desc||'Ausgabe')}</div>
        <div class="m">${ACC[e.paid]}-Konto · für ${NAMES[e.forWhom]}${d?' · '+d:''}</div>
      </div>
      <div class="amt">${eur(e.price)}</div>
      <button class="del" data-id="${e.id}">×</button>
    </li>`;
  }).join('');
  list.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(confirm('Ausgabe löschen?')){entries=entries.filter(x=>x.id!=b.dataset.id);save();render();}
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// --- sheet ------------------------------------------------------------------
const overlay=document.getElementById('overlay');
function openSheet(){
  document.getElementById('fDesc').value='';
  document.getElementById('fPrice').value='';
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
  paid=null;forWhom=null;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));
  validate();
  overlay.classList.add('open');
  setTimeout(()=>document.getElementById('fDesc').focus(),150);
}
function closeSheet(){overlay.classList.remove('open')}

document.getElementById('addBtn').onclick=openSheet;
overlay.onclick=e=>{if(e.target===overlay)closeSheet()};

document.querySelectorAll('#segPaid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#segPaid button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');paid=b.dataset.v;validate();
});
document.querySelectorAll('#segFor button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#segFor button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');forWhom=b.dataset.v;validate();
});

const priceEl=document.getElementById('fPrice');
priceEl.oninput=validate;
function validate(){
  const price=parseFloat(priceEl.value.replace(',','.'));
  document.getElementById('saveBtn').disabled=!(price>0 && paid && forWhom);
}

document.getElementById('saveBtn').onclick=()=>{
  const price=parseFloat(priceEl.value.replace(',','.'));
  if(!(price>0&&paid&&forWhom))return;
  entries.push({
    id:Date.now(),
    desc:document.getElementById('fDesc').value.trim(),
    price:Math.round(price*100)/100,
    paid,forWhom,
    date:document.getElementById('fDate').value
  });
  save();render();closeSheet();
};

// --- tools ------------------------------------------------------------------
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='splid-backup.json';a.click();
};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const data=JSON.parse(r.result);
    if(Array.isArray(data)){entries=data;save();render();alert('Importiert ✓');}
  }catch(err){alert('Ungültige Datei')}};
  r.readAsText(f);
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Wirklich ALLE Ausgaben löschen?')){entries=[];save();render();}
};

render();
</script>
</body>
</html>
