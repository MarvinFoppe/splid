<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>Splid – Cheyenne & Marvin</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Splid">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}</script>
<style>
  :root{
    --bg:#111116;--surface:#1a1a22;--surface-2:#22222c;--line:#2e2e3a;
    --text:#f2f2f5;--muted:#9a9aab;--accent:#E8505B;--accent-soft:rgba(232,80,91,.14);
    --green:#43c88a;--radius:16px;--radius-sm:11px;
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);padding:0 0 120px;max-width:560px;margin:0 auto;min-height:100vh}
  header{padding:26px 20px 14px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,transparent)}
  h1{font-size:22px;margin:0;letter-spacing:-.3px;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--muted);display:inline-block}
  .dot.on{background:var(--green)} .dot.off{background:var(--accent)}

  .balance{margin:8px 20px 4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center}
  .balance .label{color:var(--muted);font-size:13px;font-weight:500}
  .balance .amount{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
  .balance .who{font-size:14px;color:var(--muted)}
  .balance.settled .amount{color:var(--green)} .balance.owes .amount{color:var(--accent)}

  .accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 20px 6px}
  .acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 8px;text-align:center}
  .acc .n{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px}
  .acc .v{font-size:15px;font-weight:700;letter-spacing:-.2px}

  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:26px 20px 10px;display:flex;justify-content:space-between}
  ul.entries{list-style:none;margin:0;padding:0 20px}
  li.entry{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:9px}
  li.entry .ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
  li.entry .body{flex:1;min-width:0}
  li.entry .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li.entry .m{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li.entry .amt{font-weight:700;font-size:15px;white-space:nowrap}
  li.entry .del{border:none;background:none;color:var(--muted);font-size:20px;padding:0 2px;cursor:pointer;line-height:1}
  li.entry .del:active{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:30px 20px;font-size:14px}

  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;max-width:560px;width:calc(100% - 40px);background:var(--accent);color:#fff;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 10px 30px rgba(232,80,91,.35)}
  .fab:active{transform:translateX(-50%) scale(.98)}
  .fab:disabled{opacity:.4;box-shadow:none}

  .overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 16px}
  .sheet h2{font-size:18px;margin:0 0 18px}
  label.fl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 7px;text-transform:uppercase;letter-spacing:.5px}
  .field{margin-bottom:18px}
  input[type=text],input[type=number],input[type=date]{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:16px;padding:13px 14px;border-radius:var(--radius-sm);outline:none}
  input:focus{border-color:var(--accent)}
  .price-wrap{position:relative}
  .price-wrap input{padding-left:34px;font-size:22px;font-weight:700}
  .price-wrap .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:700}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .seg button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;padding:12px 6px;border-radius:var(--radius-sm);cursor:pointer;line-height:1.25}
  .seg button small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
  .seg button.active{border-color:var(--accent);background:var(--accent-soft)}
  .seg button.active small{color:var(--text)}
  .save{width:100%;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
  .save:disabled{opacity:.4}
  .tools{display:flex;gap:16px;justify-content:center;margin:34px 20px 0}
  .tools button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline}

  /* Gate */
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 28px;max-width:560px;margin:0 auto}
  .gate h2{font-size:24px;margin:0 0 6px} .gate p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
  .gate input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:18px;padding:15px;border-radius:var(--radius-sm);outline:none;text-align:center;letter-spacing:1px}
  .gate button{width:100%;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px}
</style>
</head>
<body>

<!-- Raum-Gate -->
<div class="gate" id="gate">
  <h2>Split<span style="color:var(--accent)">.</span></h2>
  <p>Gib euren gemeinsamen Code ein. Beide (Cheyenne &amp; Marvin) nutzen denselben Code, um dieselben Ausgaben zu sehen.</p>
  <input type="text" id="roomInput" placeholder="z. B. cheymarv" autocomplete="off" autocapitalize="off">
  <button id="roomGo">Los geht's</button>
</div>

<header>
  <h1>Split<span>.</span></h1>
  <div class="sub"><span class="dot" id="statusDot"></span><span id="statusTxt">verbinde…</span></div>
</header>

<div class="balance settled" id="balanceCard">
  <div class="label">Ausgleich</div>
  <div class="amount" id="balAmount">0,00 €</div>
  <div class="who" id="balWho">Alles ausgeglichen 🎉</div>
</div>

<div class="accounts" id="accounts"></div>

<div class="section-title"><span>Ausgaben</span><span id="count"></span></div>
<ul class="entries" id="entries"></ul>

<div class="tools">
  <button id="switchBtn">Code wechseln</button>
  <button id="exportBtn">Export</button>
</div>

<button class="fab" id="addBtn" disabled>＋ Ausgabe hinzufügen</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2>Neue Ausgabe</h2>
    <div class="field"><label class="fl">Beschreibung</label>
      <input type="text" id="fDesc" placeholder="z. B. Einkauf REWE" autocomplete="off"></div>
    <div class="field"><label class="fl">Preis</label>
      <div class="price-wrap"><span class="cur">€</span>
        <input type="number" id="fPrice" inputmode="decimal" step="0.01" min="0" placeholder="0,00"></div></div>
    <div class="field"><label class="fl">Bezahlt mit</label>
      <div class="seg" id="segPaid">
        <button data-v="cheyenne">Cheyenne<small>Konto</small></button>
        <button data-v="marvin">Marvin<small>Konto</small></button>
        <button data-v="gemein">Gemeinsam<small>Konto</small></button></div></div>
    <div class="field"><label class="fl">Bezahlt für</label>
      <div class="seg" id="segFor">
        <button data-v="cheyenne">Cheyenne</button>
        <button data-v="marvin">Marvin</button>
        <button data-v="gemein">Gemeinschaft</button></div></div>
    <div class="field"><label class="fl">Datum</label>
      <input type="date" id="fDate"></div>
    <button class="save" id="saveBtn" disabled>Speichern</button>
  </div>
</div>

<script>
// ==== KONFIG (Google Apps Script Web-App URL) ==============================
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw468pVe6NdQzrWCt2xhr9Du4Im2Tvi1jnlCWc82j0BOwBkK1CO13lP25R9AfUcKVJh/exec";
// ===========================================================================

const NAMES={cheyenne:'Cheyenne',marvin:'Marvin',gemein:'Gemeinschaft'};
const ACC={cheyenne:'Cheyenne',marvin:'Marvin',gemein:'Gemeinsam'};
const configured = !ENDPOINT.startsWith("__");
let room=localStorage.getItem('splid_room')||'', entries=[], pollTimer=null;

async function api(params){
  const url=ENDPOINT+'?'+new URLSearchParams(params).toString();
  const r=await fetch(url,{redirect:'follow'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function eur(n){return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function status(on,txt){const d=document.getElementById('statusDot'),t=document.getElementById('statusTxt');
  d.className='dot '+(on?'on':'off');t.textContent=txt}

function compute(){
  let prov={cheyenne:0,marvin:0},cons={cheyenne:0,marvin:0},acc={cheyenne:0,marvin:0,gemein:0};
  for(const e of entries){const p=Number(e.price);
    if(e.paid==='cheyenne')prov.cheyenne+=p;else if(e.paid==='marvin')prov.marvin+=p;else{prov.cheyenne+=p/2;prov.marvin+=p/2}
    acc[e.paid]+=p;
    if(e.for_whom==='cheyenne')cons.cheyenne+=p;else if(e.for_whom==='marvin')cons.marvin+=p;else{cons.cheyenne+=p/2;cons.marvin+=p/2}}
  return {netC:prov.cheyenne-cons.cheyenne,acc};
}
function render(){
  const {netC,acc}=compute();
  const card=document.getElementById('balanceCard'),amt=document.getElementById('balAmount'),who=document.getElementById('balWho');
  const diff=Math.abs(netC);card.className='balance';
  if(diff<0.005){card.classList.add('settled');amt.textContent='0,00 €';who.textContent='Alles ausgeglichen 🎉';}
  else{card.classList.add('owes');amt.textContent=eur(diff);who.textContent=netC>0?'Marvin schuldet Cheyenne':'Cheyenne schuldet Marvin';}
  document.getElementById('accounts').innerHTML=['cheyenne','marvin','gemein'].map(k=>
    `<div class="acc"><div class="n">${ACC[k]}</div><div class="v">${eur(acc[k])}</div></div>`).join('');
  document.getElementById('count').textContent=entries.length?entries.length+'×':'';
  const list=document.getElementById('entries');
  if(!entries.length){list.innerHTML='<div class="empty">Noch keine Ausgaben.<br>Tippe unten auf „＋".</div>';return;}
  const dval=e=>{const r=((e.date||'')+'');if(!r)return null;
    return /^\d{4}-\d{2}-\d{2}$/.test(r)?new Date(r+'T12:00:00'):new Date(r);};
  const sortKey=e=>{const d=dval(e);return d&&!isNaN(d)?d.getTime():0;};
  const sorted=[...entries].sort((a,b)=>sortKey(b)-sortKey(a)||((b.created_at||'')+'').localeCompare((a.created_at||'')+''));
  list.innerHTML=sorted.map(e=>{
    const icon=e.for_whom==='gemein'?'🤝':(e.for_whom==='cheyenne'?'👩':'🧔');
    const dv=dval(e),d=dv&&!isNaN(dv)?dv.toLocaleDateString('de-DE',{day:'2-digit',month:'short'}):'';
    return `<li class="entry"><div class="ic">${icon}</div>
      <div class="body"><div class="t">${escapeHtml(e.descr||'Ausgabe')}</div>
      <div class="m">${ACC[e.paid]}-Konto · für ${NAMES[e.for_whom]}${d?' · '+d:''}</div></div>
      <div class="amt">${eur(Number(e.price))}</div>
      <button class="del" data-id="${e.id}">×</button></li>`;}).join('');
  list.querySelectorAll('.del').forEach(b=>b.onclick=()=>delEntry(b.dataset.id));
}

// ==== Datenbank (Google Sheets via Apps Script) ============================
function cacheGet(){return JSON.parse(localStorage.getItem('splid_cache_'+room)||'[]')}
function cacheSet(){localStorage.setItem('splid_cache_'+room,JSON.stringify(entries))}

async function loadEntries(){
  if(!configured){entries=cacheGet();status(false,'Lokal (kein Sync)');render();return;}
  try{
    const res=await api({room});
    entries=res.data||[];cacheSet();
    status(true,'Sync aktiv · Code: '+room);render();
  }catch(err){
    entries=cacheGet();status(false,'Offline – Cache');render();
  }
}
function newId(){return (self.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.round(Math.random()*1e6)}

async function addEntry(o){
  o.id=newId();o.created_at=new Date().toISOString();
  entries.push({room,...o});cacheSet();render(); // optimistisch anzeigen
  if(!configured)return;
  try{await api({action:'add',room,...o});await loadEntries();}
  catch(err){alert('Konnte nicht speichern (offline?).\n'+err.message);}
}
async function delEntry(id){
  if(!confirm('Ausgabe löschen?'))return;
  entries=entries.filter(x=>x.id!=id);cacheSet();render();
  if(!configured)return;
  try{await api({action:'del',room,id});await loadEntries();}
  catch(err){alert('Konnte nicht löschen (offline?).\n'+err.message);}
}
function startPolling(){
  if(!configured)return;
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{if(document.visibilityState==='visible')loadEntries();},20000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&room)loadEntries();});

// ==== Gate / Start =========================================================
function enterRoom(code){
  room=code.trim().toLowerCase().replace(/\s+/g,'');
  if(!room)return;
  localStorage.setItem('splid_room',room);
  document.getElementById('gate').style.display='none';
  document.getElementById('addBtn').disabled=false;
  start();
}
function start(){
  status(configured,configured?'verbinde…':'Lokal (kein Sync konfiguriert)');
  loadEntries();startPolling();
}
document.getElementById('roomGo').onclick=()=>enterRoom(document.getElementById('roomInput').value);
document.getElementById('roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')enterRoom(e.target.value)});
document.getElementById('switchBtn').onclick=()=>{localStorage.removeItem('splid_room');location.reload()};

if(room){document.getElementById('gate').style.display='none';document.getElementById('addBtn').disabled=false;start();}

// ==== Sheet ================================================================
let paid=null,forWhom=null;
const overlay=document.getElementById('overlay'),priceEl=document.getElementById('fPrice');
function openSheet(){document.getElementById('fDesc').value='';priceEl.value='';
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);paid=null;forWhom=null;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));validate();
  overlay.classList.add('open');setTimeout(()=>document.getElementById('fDesc').focus(),150);}
function closeSheet(){overlay.classList.remove('open')}
document.getElementById('addBtn').onclick=openSheet;
overlay.onclick=e=>{if(e.target===overlay)closeSheet()};
document.querySelectorAll('#segPaid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#segPaid button').forEach(x=>x.classList.remove('active'));b.classList.add('active');paid=b.dataset.v;validate();});
document.querySelectorAll('#segFor button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#segFor button').forEach(x=>x.classList.remove('active'));b.classList.add('active');forWhom=b.dataset.v;validate();});
priceEl.oninput=validate;
function validate(){const p=parseFloat(priceEl.value.replace(',','.'));
  document.getElementById('saveBtn').disabled=!(p>0&&paid&&forWhom);}
document.getElementById('saveBtn').onclick=async()=>{
  const p=parseFloat(priceEl.value.replace(',','.'));if(!(p>0&&paid&&forWhom))return;
  document.getElementById('saveBtn').disabled=true;
  await addEntry({descr:document.getElementById('fDesc').value.trim(),price:Math.round(p*100)/100,
    paid,for_whom:forWhom,date:document.getElementById('fDate').value});
  closeSheet();};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='splid-backup.json';a.click();};
</script>
</body>
</html>
